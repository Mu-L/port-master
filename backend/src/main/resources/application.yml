server:
  port: 8086

spring:
  application:
    name: port-master
  jmx:
    enabled: false
  ai:
    chat:
      client:
        enabled: false

portmaster:
  monitor:
    poll-interval-ms: 5000
  scan:
    cache-ttl-ms: 3000
  ssh:
    connect-timeout-ms: 10000
    command-timeout-sec: 60
  ai:
    enabled: true
    default-provider: openai
    system-prompt: |
      你是 Port Master 的端口与进程诊断助手。根据提供的本机端口扫描摘要回答问题。
      规则：
      1. 只基于给定上下文推断，不要编造未出现的 PID/端口/进程名。
      2. 涉及结束进程或释放端口时，只给出建议步骤，不要声称已执行。
      3. 回答简洁、分点，优先给出可操作排查步骤。
      4. 用户使用中文时用中文回答，使用英文时用英文回答。
    providers:
      deepseek:
        type: openai-compatible
        display-name: DeepSeek
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-chat
        temperature: 0.3
      ollama:
        type: ollama
        display-name: Ollama（本地）
        base-url: http://localhost:11434
        api-key: ""
        model: qwen3-vl:4b
        temperature: 0.3
        max-tokens: 4096
      openai:
        type: openai
        display-name: OpenAI
        base-url: https://openai.com
        api-key: ${OPENAI_API_KEY:}
        model: gpt-3.5-turbo
        temperature: 0.3
      qwen:
        type: openai-compatible
        display-name: 通义千问（兼容模式）
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${DASHSCOPE_API_KEY:}
        model: qwen-plus
        temperature: 0.3
      moonshot:
        type: openai-compatible
        display-name: Moonshot / Kimi
        base-url: https://api.moonshot.cn/v1
        api-key: ${MOONSHOT_API_KEY:}
        model: moonshot-v1-8k
        temperature: 0.3
      siliconflow:
        type: openai-compatible
        display-name: 硅基流动
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY:}
        model: deepseek-ai/DeepSeek-V3
        temperature: 0.3
      custom:
        type: openai-compatible
        display-name: 自定义（OpenAI 兼容）
        base-url: ${PORTMASTER_AI_BASE_URL:}
        api-key: ${PORTMASTER_AI_API_KEY:}
        model: ${PORTMASTER_AI_MODEL:gpt-4o-mini}
        temperature: 0.3

logging:
  level:
    com.portmaster.ai: DEBUG
    org.springframework.ai: INFO
